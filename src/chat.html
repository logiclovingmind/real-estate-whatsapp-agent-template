<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Test Console</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --line: #e8eaed; --text: #1a1d24;
      --muted: #6b7280; --accent: #2563eb; --good: #16a34a; --warn: #d97706;
      --me: #2563eb; --bot: #eef1f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; max-width: 980px; margin: 0 auto;
    }
    .brand h1 { font-size: 19px; margin: 0; font-weight: 600; }
    .brand .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    button {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 14px;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    main {
      padding: 0 24px 32px; max-width: 980px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 320px; gap: 16px;
    }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    .chat { display: flex; flex-direction: column; height: 72vh; }
    .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot); color: var(--text); border-bottom-left-radius: 4px; }
    .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
    .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 13px; }
    .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .composer input {
      flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer button { background: var(--accent); color: #fff; border-color: var(--accent); }
    .composer button:disabled { opacity: .5; cursor: default; }
    .side h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .side .cap { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    .side { padding: 18px; }
    .stage-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .stage-new { background: #eef1f5; color: var(--muted); }
    .stage-qualifying { background: #fff4e5; color: var(--warn); }
    .stage-qualified { background: #e7f6ec; color: var(--good); }
    .stage-booked { background: #e6efff; color: var(--accent); }
    .stage-handoff, .stage-lost { background: #fdeaea; color: #dc2626; }
    .fields { list-style: none; margin: 14px 0 0; padding: 0; font-size: 13px; }
    .fields li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
    .fields .k { color: var(--muted); }
    .fields .v { font-weight: 500; text-align: right; word-break: break-word; }
    .empty { color: var(--muted); font-size: 13px; }
    .meta { color: var(--muted); font-size: 11px; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="biz">Agent Test Console</h1>
      <div class="sub">Talk to the agent exactly as a WhatsApp lead would. Writes to the live Sheet/Calendar.</div>
    </div>
    <button id="reset">New chat</button>
  </header>
  <main>
    <section class="card chat">
      <div class="log" id="log"></div>
      <form class="composer" id="composer">
        <input id="text" autocomplete="off" placeholder="Type a message as the lead…" />
        <button type="submit" id="send">Send</button>
      </form>
    </section>
    <aside class="card side">
      <h3>Lead state</h3>
      <p class="cap">Live qualification, updated each turn.</p>
      <div>Stage: <span id="stage" class="stage-pill stage-new">new</span></div>
      <ul class="fields" id="fields"></ul>
      <div class="empty" id="fieldsEmpty">No fields captured yet.</div>
      <div class="meta">Test phone: <span id="phone"></span></div>
    </aside>
  </main>

  <script>
    const log = document.getElementById("log");
    const fieldsEl = document.getElementById("fields");
    const fieldsEmpty = document.getElementById("fieldsEmpty");
    const stageEl = document.getElementById("stage");
    const phoneEl = document.getElementById("phone");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const form = document.getElementById("composer");

    function newPhone() { return "web-" + Date.now().toString(36); }
    let phone = newPhone();
    phoneEl.textContent = phone;

    function bubble(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function renderState(stage, fields) {
      stage = stage || "new";
      stageEl.textContent = stage;
      stageEl.className = "stage-pill stage-" + stage;
      fieldsEl.innerHTML = "";
      const keys = Object.keys(fields || {}).filter((k) => fields[k] !== "" && fields[k] != null);
      if (keys.length === 0) { fieldsEmpty.style.display = "block"; return; }
      fieldsEmpty.style.display = "none";
      for (const k of keys) {
        const li = document.createElement("li");
        const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
        const vv = document.createElement("span"); vv.className = "v"; vv.textContent = fields[k];
        li.append(kk, vv); fieldsEl.appendChild(li);
      }
    }

    async function send(text) {
      bubble(text, "me");
      sendBtn.disabled = true; input.disabled = true;
      const typing = document.createElement("div");
      typing.className = "typing"; typing.textContent = "agent is typing…";
      log.appendChild(typing); log.scrollTop = log.scrollHeight;
      try {
        const res = await fetch("./api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, text }),
        });
        const data = await res.json();
        typing.remove();
        if (!data.ok) { bubble("[error: " + (data.reason || res.status) + "]", "sys"); return; }
        bubble(data.reply || "(no reply)", "bot");
        if (data.handoff) bubble("handoff flagged: " + (data.handoffReason || ""), "sys");
        renderState(data.stage, data.fields);
      } catch (err) {
        typing.remove();
        bubble("[network error: " + err.message + "]", "sys");
      } finally {
        sendBtn.disabled = false; input.disabled = false; input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = "";
      send(t);
    });

    document.getElementById("reset").addEventListener("click", () => {
      phone = newPhone();
      phoneEl.textContent = phone;
      log.innerHTML = "";
      renderState("new", {});
      bubble("New conversation started.", "sys");
      input.focus();
    });

    fetch("./api/chat/meta").then((r) => r.json()).then((d) => {
      if (d.businessName) document.getElementById("biz").textContent = d.businessName + " — Test Console";
    }).catch(() => {});

    renderState("new", {});
    input.focus();
  </script>
</body>
</html>
